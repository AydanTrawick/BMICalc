OPENAI_API_KEY = "your-openai-api-key"
OPENAI_MODEL = "gpt-5-mini"

# Neon Postgres connection string.
# You can also name this NEON_DATABASE_URL.
DATABASE_URL = "postgresql://user:password@host/dbname?sslmode=require"

# Accounts with these emails are promoted to owner when they sign in.
# Comma-separated strings and TOML arrays are both supported.
OWNER_EMAILS = "you@example.com"
# ADMIN_EMAILS = ["manager@example.com"]

EMAIL_ADDRESS = "you@example.com"
EMAIL_PASSWORD = "your-email-app-password"
API_URL = "https://your-equipment-api.example.com"

# Equipment Classifier feedback (pages/EquipmentClassifier.py, pages/Feedback_Review.py)
ADMIN_PASSWORD = "choose-a-strong-password"
# "r2" or "local"; if omitted, falls back to "local" unless all R2_* keys below are set.
STORAGE_BACKEND = "r2"
R2_ACCOUNT_ID = "your-cloudflare-account-id"
R2_ACCESS_KEY_ID = "your-r2-access-key-id"
R2_SECRET_ACCESS_KEY = "your-r2-secret-access-key"
R2_BUCKET_NAME = "your-r2-bucket-name"
